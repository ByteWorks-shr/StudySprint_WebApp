server.port=8080
spring.application.name=StudySprint

# In-Memory Database for Notes & Tasks
spring.datasource.url=jdbc:h2:mem:omnistudydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Static Resources for HTML/CSS/JS frontend
spring.web.resources.static-locations=classpath:/static/

# Gemini API Key (Injected via Environment Variable or application.properties)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
